<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>내 떡볶이 패스</title>
    
    <link rel="apple-touch-icon" sizes="192x192" href="icon.png?v=6">
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png?v=6">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style> body { font-family: 'Pretendard', sans-serif; background-color: #fffaf0; } </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">
    <div class="bg-white rounded-3xl p-8 shadow-xl text-center w-full max-w-sm border-2 border-orange-100">
        <div class="bg-gradient-to-r from-red-400 to-red-500 text-white rounded-xl p-3 mb-6 shadow-sm">
            <h1 class="text-xl font-bold">🍡 내 떡볶이 패스</h1>
        </div>
        
        <h2 class="text-3xl font-extrabold mb-2" id="studentName">학생증</h2>
        <p class="text-gray-500 mb-6 text-sm">출석할 때 보여주세요!</p>
        
        <div id="qrcode" class="flex justify-center mb-6 p-4 bg-white rounded-2xl border-4 border-dashed border-red-200"></div>
        
        <div class="bg-orange-50 rounded-lg p-4 mb-4">
            <p class="text-sm text-orange-800 font-bold mb-1">내 떡볶이 포인트</p>
            <p class="text-3xl font-black text-orange-600" id="pointsDisplay">0 P</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCgqbnQUuipS1iDMO7tUVgE-3L0c9SzbdY",
            authDomain: "tteokbokki-373b3.firebaseapp.com",
            databaseURL: "https://tteokbokki-373b3-default-rtdb.firebaseio.com",
            projectId: "tteokbokki-373b3",
            storageBucket: "tteokbokki-373b3.firebasestorage.app",
            messagingSenderId: "117450022544",
            appId: "1:117450022544:web:d93b193e236d3398218215"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // 2. 바탕화면 앱이 길을 잃지 않도록, 주소창의 꼬리표를 절대 지우지 않습니다!
        const urlParams = new URLSearchParams(window.location.search);
        let myId = urlParams.get('id');
        let myName = urlParams.get('name');

        if (myId && myName) {
            localStorage.setItem('my_pass_id', myId);
            localStorage.setItem('my_pass_name', myName);
        } else {
            myId = localStorage.getItem('my_pass_id');
            myName = localStorage.getItem('my_pass_name');
        }

        if (myId && myName) {
            document.getElementById('studentName').innerText = myName;
            new QRCode(document.getElementById("qrcode"), { text: myId, width: 200, height: 200 });

            // 클라우드에서 실시간 포인트 수신
            db.ref('students/' + myId).on('value', (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    document.getElementById('pointsDisplay').innerText = data.points + " P";
                } else {
                    document.getElementById('pointsDisplay').innerText = "0 P";
                }
            });
        }
    </script>
</body>
</html>
