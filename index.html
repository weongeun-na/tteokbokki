<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>떡볶이 패스 - 출석부</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="icon.png?v=3">
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png?v=3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style> body { font-family: 'Pretendard', sans-serif; background-color: #fffaf0; } </style>
</head>
<body class="p-4 max-w-md mx-auto relative">
    <div class="bg-gradient-to-r from-red-400 to-red-500 text-white rounded-2xl p-6 mb-6 text-center shadow-lg">
        <h1 class="text-2xl font-bold mb-2">🍡 떡볶이 패스</h1>
        <p class="text-sm">선생님 관리용 (실시간 연동)</p>
    </div>

    <button onclick="openScanner()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-full mb-6 shadow-md">📷 QR 스캔 출석</button>

    <div class="bg-white rounded-2xl p-5 mb-6 shadow-sm border border-orange-100">
        <h2 class="font-bold text-gray-700 mb-3">새 친구 등록</h2>
        <div class="flex gap-2">
            <input type="text" id="studentName" placeholder="이름 입력" class="flex-1 border border-gray-300 rounded-lg px-3 py-2">
            <button onclick="addStudent()" class="bg-orange-500 text-white font-bold py-2 px-4 rounded-lg">등록</button>
        </div>
    </div>

    <div class="bg-white rounded-2xl p-5 shadow-sm border border-orange-100 mb-10">
        <h2 class="font-bold text-gray-700 mb-4">학생 목록</h2>
        <div id="studentList" class="space-y-4"></div>
    </div>

    <div id="qrModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-40">
        <div class="bg-white rounded-2xl p-6 text-center w-full max-w-sm">
            <h3 id="qrModalTitle" class="font-bold text-xl mb-4"></h3>
            <div id="qrcode" class="flex justify-center mb-6"></div>
            <button onclick="copyLink()" class="w-full bg-green-500 text-white font-bold py-3 rounded-lg mb-2">🔗 학생에게 링크 전송</button>
            <button onclick="closeQrModal()" class="w-full bg-gray-200 text-gray-800 font-bold py-2 rounded-lg">닫기</button>
        </div>
    </div>

    <div id="scannerModal" class="fixed inset-0 bg-black bg-opacity-90 hidden flex items-center justify-center p-4 z-50 flex-col">
        <div id="reader" class="w-full max-w-sm bg-white rounded-lg overflow-hidden"></div>
        <button onclick="closeScanner()" class="mt-8 bg-red-500 text-white py-3 px-8 rounded-full">닫기</button>
    </div>

    <script>
        // 파이어베이스 설정 및 연결
        const firebaseConfig = {
            apiKey: "AIzaSyCgqbnQUuipS1iDMO7tUVgE-3L0c9SzbdY",
            authDomain: "tteokbokki-373b3.firebaseapp.com",
            databaseURL: "https://tteokbokki-373b3-default-rtdb.firebaseio.com",
            projectId: "tteokbokki-373b3",
            storageBucket: "tteokbokki-373b3.firebasestorage.app",
            messagingSenderId: "117450022544",
            appId: "1:117450022544:web:d93b193e236d3398218215"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let students = [];
        let html5QrcodeScanner = null;
        let currentShareLink = ""; 

        // 실시간 데이터 불러오기
        db.ref('students').on('value', (snapshot) => {
            students = [];
            snapshot.forEach((child) => { students.push(child.val()); });
            renderStudents();
        });

        function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) return;
            const id = 'STU_' + Date.now();
            db.ref('students/' + id).set({ id: id, name: name, points: 0 });
            document.getElementById('studentName').value = '';
        }

        function addPoints(id, amount) {
            const student = students.find(s => s.id === id);
            if(student) db.ref('students/' + id).update({ points: student.points + amount });
        }

        function redeemPoints(id, amount) {
            const student = students.find(s => s.id === id);
            if (student && student.points >= amount) {
                if(confirm(`${student.name} 학생 포인트 사용 (-50P)?`)) {
                    db.ref('students/' + id).update({ points: student.points - amount });
                }
            } else alert('포인트 부족!');
        }

        function renderStudents() {
            const list = document.getElementById('studentList');
            list.innerHTML = '';
            students.forEach(student => {
                list.innerHTML += `
                    <div class="border-b pb-4 mb-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-lg">${student.name}</span>
                            <span class="bg-red-100 text-red-600 font-bold px-3 py-1 rounded-full">${student.points} P</span>
                        </div>
                        <div class="flex gap-2 text-sm">
                            <button onclick="addPoints('${student.id}', 10)" class="flex-1 bg-green-50 text-green-600 border border-green-200 py-1.5 rounded">수동출석</button>
                            <button onclick="redeemPoints('${student.id}', 50)" class="flex-1 bg-blue-50 text-blue-600 border border-blue-200 py-1.5 rounded">선물교환</button>
                            <button onclick="showQR('${student.id}', '${student.name}')" class="flex-1 bg-gray-50 border py-1.5
