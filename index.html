<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>떡볶이 패스 - 출석부</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="icon.png?v=9">
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png?v=9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style> 
        body { font-family: 'Pretendard', sans-serif; background-color: #fffaf0; overflow-x: hidden; } 
    </style>
</head>
<body class="p-4 max-w-md mx-auto relative pb-10">
    
    <div class="bg-gradient-to-r from-red-400 to-red-500 text-white rounded-2xl p-6 mb-6 text-center shadow-lg w-full">
        <h1 class="text-2xl font-bold mb-2">🍡 떡볶이 패스</h1>
        <p class="text-sm">선생님 관리용 (실시간 연동)</p>
    </div>

    <button onclick="openScanner()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-2xl mb-6 shadow-md text-lg flex justify-center items-center gap-2 transition active:scale-95">
        📷 QR 스캔해서 출석하기
    </button>

    <div class="bg-white rounded-2xl p-5 mb-6 shadow-sm border border-orange-100 w-full">
        <h2 class="font-bold text-gray-700 mb-3">새 친구 등록</h2>
        <div class="flex flex-col gap-3">
            <input type="text" id="studentName" placeholder="이름을 입력하세요" class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:border-red-400 text-base">
            <button onclick="addStudent()" class="w-full bg-orange-500 text-white font-bold py-3 rounded-xl active:bg-orange-600 transition text-base shadow-sm">등록하기</button>
        </div>
    </div>

    <div class="bg-white rounded-2xl p-5 shadow-sm border border-orange-100 mb-10 w-full">
        <h2 class="font-bold text-gray-700 mb-4">학생 목록</h2>
        <div id="studentList" class="space-y-5"></div>
    </div>

    <div id="qrModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-40">
        <div class="bg-white rounded-3xl p-6 text-center w-full max-w-sm">
            <h3 id="qrModalTitle" class="font-bold text-xl mb-4 text-gray-800"></h3>
            <div id="qrcode" class="flex justify-center mb-6 border-4 border-dashed border-red-100 p-4 rounded-xl"></div>
            <button onclick="copyLink()" class="w-full bg-green-500 text-white font-bold py-3 rounded-xl mb-2 shadow-sm">🔗 학생에게 링크 전송</button>
            <button onclick="closeQrModal()" class="w-full bg-gray-200 text-gray-800 font-bold py-3 rounded-xl">닫기</button>
        </div>
    </div>

    <div id="scannerModal" class="fixed inset-0 bg-black bg-opacity-90 hidden flex items-center justify-center p-4 z-50 flex-col">
        <h3 class="text-white text-xl font-bold mb-4">QR 코드를 스캔하세요</h3>
        <div id="reader" class="w-full max-w-sm bg-white rounded-lg overflow-hidden"></div>
        <button onclick="closeScanner()" class="mt-8 bg-red-500 text-white font-bold py-3 px-8 rounded-full">취소 및 닫기</button>
    </div>

    <div id="pointModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-5 border-b pb-3">
                <h3 id="pointModalTitle" class="font-bold text-xl text-gray-800">포인트 관리</h3>
                <span id="pointModalCurrent" class="bg-red-100 text-red-600 font-black px-3 py-1 rounded-full text-lg">0 P</span>
            </div>

            <div class="mb-8">
                <h4 class="text-sm font-bold text-green-600 mb-2 flex items-center gap-1">🟢 포인트 적립 (칭찬해요!)</h4>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <button onclick="changePoints(20, '📖 성경 암송')" class="bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 font-semibold py-2 rounded-lg text-sm active:scale-95 transition">📖 성경 암송 (+20)</button>
                    <button onclick="changePoints(10, '✍️ 성경 퀴즈')" class="bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 font-semibold py-2 rounded-lg text-sm active:scale-95 transition">✍️ 성경 퀴즈 (+10)</button>
                    <button onclick="changePoints(10, '🙏 예배 태도')" class="bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 font-semibold py-2 rounded-lg text-sm active:scale-95 transition">🙏 예배 태도 (+10)</button>
                    <button onclick="changePoints(10, '🏃 일반 출석')" class="bg-green-50 hover:bg-green-100 text-green-700 border border-green-200 font-semibold py-2 rounded-lg text-sm active:scale-95 transition">🏃 일반 출석 (+10)</button>
                </div>
                
                <div class="flex flex-row items-center gap-2 mt-4 pt-4 border-t border-gray-100">
                    <input type="number" id="customAddInput" placeholder="직접 입력 (예: 15)" class="flex-1 min-w-0 border border-gray-300 rounded-xl px-3 py-2.5 text-base focus:outline-none focus:border-green-400">
                    <button onclick="addCustomPoints()" class="shrink-0 bg-green-500 text-white font-bold py-2.5 px-5 rounded-xl text-base active:bg-green-600 transition shadow-sm">적립</button>
                </div>
            </div>

            <div class="mb-4">
                <h4 class="text-sm font-bold text-orange-600 mb-2 flex items-center gap-1">🔴 포인트 사용 (선물 교환!)</h4>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <button onclick="changePoints(-50, '🍡 떡볶이')" class="bg-orange-50 hover:bg-orange-100 text-orange-700 border border-orange-200 font-semibold py-2 rounded-lg text-sm active:scale-95 transition">🍡 떡볶이 (-50)</button>
                    <button onclick="changePoints(-30, '🍜 컵라면')" class="bg-orange-50 hover:bg-orange-100 text-orange-700 border border-orange-200 font-semibold py-2 rounded-lg text-sm active:scale-95 transition">🍜 컵라면 (-30)</button>
                    <button onclick="changePoints(-10, '🍬 간식/음료')" class="bg-orange-50 hover:bg-orange-100 text-orange-700 border border-orange-200 font-semibold py-2 rounded-lg text-sm active:scale-95 transition">🍬 간식/음료 (-10)</button>
                    <button onclick="changePoints(-100, '🎁 특별 선물')" class="bg-orange-50 hover:bg-orange-100 text-orange-700 border border-orange-200 font-semibold py-2 rounded-lg text-sm active:scale-95 transition">🎁 특별 선물 (-100)</button>
                </div>

                <div class="flex flex-row items-center gap-2 mt-4 pt-4 border-t border-gray-100">
                    <input type="number" id="customDeductInput" placeholder="직접 입력 (예: 25)" class="flex-1 min-w-0 border border-gray-300 rounded-xl px-3 py-2.5 text-base focus:outline-none focus:border-orange-400">
                    <button onclick="deductCustomPoints()" class="shrink-0 bg-orange-500 text-white font-bold py-2.5 px-5 rounded-xl text-base active:bg-orange-600 transition shadow-sm">차감</button>
                </div>
            </div>

            <button onclick="closePointModal()" class="w-full bg-gray-200 text-gray-800 font-bold py-4 rounded-xl active:bg-gray-300 transition mt-4 text-base">닫기</button>
        </div>
    </div>

    <script>
        window.onerror = function(msg) { alert("코드 오류 발생: " + msg); };

        const firebaseConfig = {
            apiKey: "AIzaSyCgqbnQUuipS1iDMO7tUVgE-3L0c9SzbdY",
            authDomain: "tteokbokki-373b3.firebaseapp.com",
            databaseURL: "https://tteokbokki-373b3-default-rtdb.firebaseio.com",
            projectId: "tteokbokki-373b3",
            storageBucket: "tteokbokki-373b3.firebasestorage.app",
            messagingSenderId: "117450022544",
            appId: "1:117450022544:web:d93b193e236d3398218215"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let students = [];
        let html5QrcodeScanner = null;
        let currentShareLink = ""; 
        let currentPointStudentId = null; 

        db.ref('students').on('value', (snapshot) => {
            students = [];
            snapshot.forEach((child) => { students.push(child.val()); });
            renderStudents();
        });

        function addStudent() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) { alert("이름을 입력해주세요!"); return; }
            const id = 'STU_' + Date.now();
            db.ref('students/' + id).set({ id: id, name: name, points: 0 })
              .then(() => { document.getElementById('studentName').value = ''; })
              .catch((error) => { alert("데이터베이스 연결 실패!"); });
        }

        function renderStudents() {
            const list = document.getElementById('studentList');
            list.innerHTML = '';
            if (students.length === 0) { list.innerHTML = '<p class="text-gray-400 text-center py-4">등록된 학생이 없습니다.</p>'; return; }
            
            students.forEach(student => {
                list.innerHTML += `
                    <div class="border-b border-gray-100 pb-5 last:border-0 last:pb-0">
                        <div class="flex justify-between items-center mb-3 px-1">
                            <span class="font-bold text-lg text-gray-800">${student.name}</span>
                            <span class="bg-red-100 text-red-600 font-bold px-3 py-1 rounded-full text-sm">${student.points} P</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="openPointModal('${student.id}')" class="w-2/3 bg-indigo-50 text-indigo-700 border border-indigo-200 font-bold py-2.5 rounded-xl flex items-center justify-center gap-1 active:bg-indigo-100 transition"><span class="text-base">🪙</span> 포인트 관리</button>
                            <button onclick="showQR('${student.id}', '${student.name}')" class="w-1/3 bg-gray-50 text-gray-600 border border-gray-200 font-medium py-2.5 rounded-xl active:bg-gray-100 transition">QR보기</button>
                        </div>
                    </div>`;
            });
        }

        function openPointModal(id) {
            const student = students.find(s => s.id === id);
            if (!student) return;
            currentPointStudentId = id;
            document.getElementById('pointModalTitle').innerText = `${student.name} 학생`;
            document.getElementById('pointModalCurrent').innerText = `${student.points} P`;
            document.getElementById('customAddInput').value = '';
            document.getElementById('customDeductInput').value = '';
            document.getElementById('pointModal').classList.remove('hidden');
        }

        function closePointModal() {
            document.getElementById('pointModal').classList.add('hidden');
            currentPointStudentId = null;
        }

        function changePoints(amount, reason) {
            if (!currentPointStudentId) return;
            const student = students.find(s => s.id === currentPointStudentId);
            if (!student) return;

            if (amount < 0 && student.points < Math.abs(amount)) {
                alert(`포인트가 부족합니다! (현재: ${student.points}P)`);
                return;
            }

            const confirmMsg = amount > 0 
                ? `[${reason}] 사유로 ${amount}P를 적립할까요?`
                : `[${reason}] (으)로 ${Math.abs(amount)}P를 사용할까요?`;

            if (confirm(confirmMsg)) {
                const newPoints = student.points + amount;
                db.ref('students/' + currentPointStudentId).update({ points: newPoints })
                  .then(() => {
                      document.getElementById('pointModalCurrent').innerText = `${newPoints} P`;
                  });
            }
        }

        function addCustomPoints() {
            const val = parseInt(document.getElementById('customAddInput').value);
            if (isNaN(val) || val <= 0) { alert("정확한 점수를 숫자로 입력해주세요."); return; }
            changePoints(val, '직접 입력 적립');
            document.getElementById('customAddInput').value = '';
        }

        function deductCustomPoints() {
            const val = parseInt(document.getElementById('customDeductInput').value);
            if (isNaN(val) || val <= 0) { alert("정확한 점수를 숫자로 입력해주세요."); return; }
            changePoints(-val, '직접 입력 사용');
            document.getElementById('customDeductInput').value = '';
        }

        function showQR(id, name) {
            document.getElementById('qrModalTitle').innerText = `${name} 학생`;
            document.getElementById('qrcode').innerHTML = ''; 
            new QRCode(document.getElementById("qrcode"), { text: id, width: 150, height: 150 });
            let path = window.location.pathname.replace("index.html", "");
            if (!path.endsWith("/")) path += "/";
            currentShareLink = `${name} 학생증\n${window.location.origin}${path}student.html?id=${id}&name=${encodeURIComponent(name)}`;
            document.getElementById('qrModal').classList.remove('hidden');
        }

        function copyLink() {
            navigator.clipboard.writeText(currentShareLink).then(() => alert('복사완료! 카톡에 붙여넣으세요.'));
        }
        function closeQrModal() { document.getElementById('qrModal').classList.add('hidden'); }

        function openScanner() {
            document.getElementById('scannerModal').classList.remove('hidden');
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (id) => {
                const student = students.find(s => s.id === id);
                if(student) {
                    html5QrcodeScanner.stop().then(() => {
                        closeScanner();
                        const newPoints = student.points + 10;
                        db.ref('students/' + id).update({ points: newPoints }).then(() => {
                            alert(`🎉 ${student.name} 출석! 10P 적립`);
                        });
                    });
                } else {
                    alert("등록되지 않은 학생입니다.");
                }
            }).catch(() => { alert("카메라 권한을 허용해주세요."); closeScanner(); });
        }
        function closeScanner() {
            document.getElementById('scannerModal').classList.add('hidden');
            if(html5QrcodeScanner) html5QrcodeScanner.stop().catch(e=>e);
        }
    </script>
</body>
</html>
