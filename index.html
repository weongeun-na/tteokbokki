<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>떡볶이 패스 - 출석 & 포인트</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="icon.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png?v=2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #fffaf0; }
        .tteokbokki-gradient { background: linear-gradient(135deg, #ff6b6b, #ff4757); }
    </style>
</head>
<body class="p-4 max-w-md mx-auto relative">

    <div class="tteokbokki-gradient text-white rounded-2xl p-6 mb-6 shadow-lg text-center">
        <h1 class="text-2xl font-bold mb-2">🍡 떡볶이 패스</h1>
        <p class="text-sm opacity-90">선생님 관리용 출석부</p>
    </div>

    <div class="mb-6 flex justify-center">
        <button onclick="openScanner()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-full shadow-md flex items-center gap-2 text-lg transition-transform transform active:scale-95 w-full justify-center">
            📷 QR 스캔해서 출석하기
        </button>
    </div>

    <div class="bg-white rounded-2xl p-5 mb-6 shadow-sm border border-orange-100">
        <h2 class="font-bold text-gray-700 mb-3">새 친구 등록</h2>
        <div class="flex gap-2 items-center w-full">
            <input type="text" id="studentName" placeholder="학생 이름 입력" class="flex-1 min-w-0 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-red-400">
            <button onclick="addStudent()" class="bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-4 rounded-lg whitespace-nowrap transition">등록</button>
        </div>
    </div>

    <div class="bg-white rounded-2xl p-5 shadow-sm border border-orange-100 mb-10">
        <h2 class="font-bold text-gray-700 mb-4">학생 목록 및 포인트</h2>
        <div id="studentList" class="space-y-4"></div>
    </div>

    <div id="qrModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center p-4 z-40">
        <div class="bg-white rounded-2xl p-6 text-center max-w-sm w-full">
            <h3 id="qrModalTitle" class="font-bold text-xl mb-4 text-gray-800"></h3>
            <div id="qrcode" class="flex justify-center mb-6"></div>
            
            <button onclick="copyStudentLink()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg mb-3 shadow-sm">
                🔗 학생에게 앱 링크 카톡으로 보내기
            </button>
            <button onclick="closeQrModal()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg">닫기</button>
        </div>
    </div>

    <div id="scannerModal" class="fixed inset-0 bg-black bg-opacity-90 hidden flex items-center justify-center p-4 z-50 flex-col">
        <h3 class="text-white text-xl font-bold mb-4">QR 코드를 네모 안에 맞춰주세요</h3>
        <div id="reader" class="w-full max-w-sm bg-white rounded-lg overflow-hidden"></div>
        <button onclick="closeScanner()" class="mt-8 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-8 rounded-full text-lg">취소 및 닫기</button>
    </div>

    <script>
        let students = JSON.parse(localStorage.getItem('tteokbokki_students')) || [];
        let html5QrcodeScanner = null;
        let currentShareLink = ""; 

        function saveAndRender() {
            localStorage.setItem('tteokbokki_students', JSON.stringify(students));
            renderStudents();
        }

        function addStudent() {
            const nameInput = document.getElementById('studentName');
            const name = nameInput.value.trim();
            if (!name) return alert('이름을 입력해주세요!');
            const newStudent = { id: 'STU_' + Date.now(), name: name, points: 0 };
            students.push(newStudent);
            nameInput.value = '';
            saveAndRender();
        }

        function addPoints(id, amount) {
            const student = students.find(s => s.id === id);
            if (student) { student.points += amount; saveAndRender(); }
        }

        function redeemPoints(id, amount) {
            const student = students.find(s => s.id === id);
            if (student && student.points >= amount) {
                if(confirm(`${student.name} 학생에게 선물을 주고 50P를 차감할까요?`)) {
                    student.points -= amount;
                    saveAndRender();
                }
            } else { alert('포인트가 부족합니다!'); }
        }

        function renderStudents() {
            const list = document.getElementById('studentList');
            list.innerHTML = '';
            if (students.length === 0) { list.innerHTML = '<p class="text-gray-400 text-center py-4">아직 등록된 학생이 없습니다.</p>'; return; }

            students.forEach(student => {
                const item = document.createElement('div');
                item.className = 'flex flex-col border-b border-gray-100 pb-4 mb-4 last:border-0 last:pb-0 last:mb-0';
                item.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-bold text-lg text-gray-800">${student.name}</span>
                        <span class="bg-red-100 text-red-600 font-bold px-3 py-1 rounded-full text-sm">${student.points} P</span>
                    </div>
                    <div class="flex gap-2 text-sm">
                        <button onclick="addPoints('${student.id}', 10)" class="flex-1 bg-green-50 text-green-600 border border-green-200 hover:bg-green-100 font-medium py-1.5 rounded text-center whitespace-nowrap">수동출석</button>
                        <button onclick="redeemPoints('${student.id}', 50)" class="flex-1 bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 font-medium py-1.5 rounded text-center whitespace-nowrap">선물교환</button>
                        <button onclick="showQR('${student.id}', '${student.name}')" class="flex-1 bg-gray-50 text-gray-600 border border-gray-200 hover:bg-gray-100 font-medium py-1.5 rounded text-center whitespace-nowrap">QR보기</button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function showQR(id, name) {
            document.getElementById('qrModalTitle').innerText = `${name} 학생의 QR코드`;
            document.getElementById('qrcode').innerHTML = ''; 
            new QRCode(document.getElementById("qrcode"), { text: id, width: 150, height: 150, colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H });
            
            // 학생에게 보낼 개인 링크 생성하기
            const baseUrl = window.location.href.split('index.html')[0].replace(/\/$/, ""); 
            currentShareLink = `${baseUrl}/student.html?id=${id}&name=${encodeURIComponent(name)}`;
            
            document.getElementById('qrModal').classList.remove('hidden');
        }

        function copyStudentLink() {
            navigator.clipboard.writeText(currentShareLink).then(() => {
                alert('복사되었습니다! 카카오톡 채팅창에 붙여넣기 해서 학생에게 보내주세요.');
            }).catch(err => {
                alert('복사 실패. 다시 시도해주세요.');
            });
        }

        function closeQrModal() { document.getElementById('qrModal').classList.add('hidden'); }

        function openScanner() {
            document.getElementById('scannerModal').classList.remove('hidden');
            html5QrcodeScanner = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            html5QrcodeScanner.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(err => { alert("카메라 권한을 허용해주세요."); closeScanner(); });
        }

        function onScanSuccess(decodedText, decodedResult) {
            const student = students.find(s => s.id === decodedText);
            if(student) {
                html5QrcodeScanner.stop().then(() => {
                    closeScanner(); student.points += 10; saveAndRender();
                    alert(`🎉 ${student.name} 학생 출석 확인! 10포인트 적립!`);
                }).catch(err => console.error(err));
            } else { alert("등록되지 않은 학생입니다."); }
        }

        function closeScanner() {
            document.getElementById('scannerModal').classList.add('hidden');
            if(html5QrcodeScanner) html5QrcodeScanner.stop().catch(e => console.log(e));
        }

        renderStudents();
    </script>
</body>
</html>
